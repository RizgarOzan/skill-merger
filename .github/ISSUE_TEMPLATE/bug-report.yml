name: Bug report
description: Something in scripts/skills.py or the install is broken
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: python3 scripts/skills.py check ~/.claude/skills/my-skill
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: env
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.12
